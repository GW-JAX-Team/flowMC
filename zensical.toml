[project]
site_name = "flowMC"
site_url = "https://gw-jax-team.github.io/flowMC/"
site_description = "A JAX-based normalizing-flow-enhanced MCMC sampler for probabilistic inference"
site_author = "GW JAX Team"
repo_url = "https://github.com/GW-JAX-Team/flowMC"
repo_name = "GW-JAX-Team/flowMC"

extra_javascript = [
    "javascripts/mathjax.js",
    "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js",
]

nav = [
    {"Home" = "index.md"},
    {"Installation" = "installation.md"},
    {"Quick Start" = "quickstart.md"},
    {"Tutorials" = [
        "tutorials/index.md",
        {"Step-by-Step Example" = "tutorials/dualmoon.md"},
        {"Parallel Tempering" = "tutorials/parallel_tempering.md"},
        {"Custom Sampling Strategy" = "tutorials/custom_strategy.md"},
    ]},
    {"Guides" = [
        "guides/index.md",
        {"Training Normalizing Flows" = "guides/train_normalizing_flow.md"},
        {"Training Flow Matching Models" = "guides/train_flow_match.md"},
    ]},
    {"How-to" = [
        "how-to/index.md",
        {"Reduce GPU Memory Use" = "how-to/reduce_gpu_memory.md"},
    ]},
    {"Technical Notes" = [
        "notes/index.md",
        {"Architecture" = "notes/architecture.md"},
        {"Bundles" = "notes/bundles.md"},
        {"Hyperparameter Reference" = "notes/hyperparameters.md"},
    ]},
    {"Development" = [
        "dev/index.md",
    ]},
    {"FAQ" = "FAQ.md"},
    {"Citing flowMC" = "citing.md"},
    {"Contributing" = "contributing.md"},
    # API section is auto-generated by docs/gen_api.py at build time
]

[project.extra.version]
provider = "mike"
default = "stable"

[project.theme]
variant = "modern"
features = [
    "content.code.copy",
    "navigation.instant",
    "navigation.tabs",
    "navigation.top",
    "toc.follow",
    "header.autohide",
]
palette = [
    {scheme = "slate", toggle = {icon = "material/brightness-4", name = "Switch to light mode"}},
    {scheme = "default", toggle = {icon = "material/brightness-7", name = "Switch to dark mode"}},
]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = "¤"
toc_depth = 4

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
filters = ["!^_[^_]", "!^logger$"]
inherited_members = false
group_by_category = true
show_category_heading = false
summary = {attributes = true, functions = true}
show_root_heading = false
show_root_full_path = false
show_if_no_docstring = false
show_signature_annotations = true
show_source = false
members_order = ["__all__", "alphabetical"]
heading_level = 3
