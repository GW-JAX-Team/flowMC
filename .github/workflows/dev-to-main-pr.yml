name: Scheduled dev -> main PR

# Opens a PR merging flowMC-dev into main on the last Thursday of each month.
# Cron can't express "last Thursday" directly, so this runs every Thursday
# and the gate step below skips all but the final one in the month.

on:
  schedule:
    - cron: "30 2 * * 4"  # every Thursday, 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check if today is the last Thursday of the month
        id: gate
        run: |
          today=$(date -u +%-d)
          next_week=$(date -u -d "+7 days" +%-d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$next_week" -le "$today" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false  # only local git reads + gh (GH_TOKEN) are used

      - name: Open PR from flowMC-dev to main and request CodeRabbit review
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head flowMC-dev --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            ahead_count=$(git rev-list --count origin/main..origin/flowMC-dev)
            if [ "$ahead_count" -eq 0 ]; then
              echo "flowMC-dev has no commits ahead of main; nothing to merge."
              exit 0
            fi

            if git diff --quiet origin/main...origin/flowMC-dev; then
              echo "flowMC-dev has commits ahead of main but no net diff; nothing to merge."
              exit 0
            fi

            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head flowMC-dev \
              --title "Scheduled sync: flowMC-dev -> main ($(date -u +'%B %Y'))" \
              --body "Automated monthly pull request merging \`flowMC-dev\` into \`main\`.")
          fi

          gh pr comment "$pr_url" \
            --repo "$GITHUB_REPOSITORY" \
            --body "@coderabbitai review"
