name: CI

on:
  pull_request:
    branches: [main, flowMC-dev]
  push:
    branches: [main, flowMC-dev]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group test
      - name: Run tests
        run: |
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            uv run pytest --cov=flowMC --cov-report=term-missing tests/
          else
            uv run pytest tests/
          fi
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: uv run coveralls

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group test
      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  publish:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/flowMC/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  merge-main-to-dev:
    needs: [publish]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: flowMC-dev
          fetch-depth: 0
      - name: Merge main into flowMC-dev, or open a PR on conflict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          before=$(git rev-parse HEAD)
          if git merge --no-edit origin/main; then
            git push origin flowMC-dev
            if [ "$(git rev-parse HEAD)" != "$before" ]; then
              gh workflow run CI.yml --ref flowMC-dev
            fi
          else
            git merge --abort
            existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base flowMC-dev --head main --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "PR #$existing already open for main -> flowMC-dev merge."
            else
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base flowMC-dev \
                --head main \
                --title "Merge main into flowMC-dev after release" \
                --body "Automated merge of main into flowMC-dev failed due to conflicts. Please resolve manually."
            fi
          fi

  publish-testpypi:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flowmc/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build package
        run: uv build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          skip-existing: true
