[project]
name = "flowMC"
dynamic = ["version"]
description = "A JAX-based normalizing-flow-enhanced MCMC sampler for probabilistic inference"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kaze W. K. Wong", email = "kazewong.physics@gmail.com"},
    { name = "Marylou Gabrié"},
    { name = "Dan Foreman-Mackey"}
]
maintainers = [
  {name = "Thomas Ng", email = "thomas.ng@nikhef.nl"}
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
keywords = ["sampling", "inference", "machine learning", "normalizing", "autodiff", "jax"]

dependencies = [
    "diffrax>=0.7.0",
    "equinox>=0.11.12",
    "jax>=0.8.2",
    "jaxtyping>=0.3.3",
    "optax>=0.2.7",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
cuda = [
    "jax[cuda]>=0.8.2",
]
visualize = [
    "numpy",
    "arviz>=0.21.0",
    "corner>=2.2.3",
    "matplotlib>=3.10.7",
]

[dependency-groups]
test = [
    "coveralls>=4.0.1",
    "pre-commit>=4.0.1",
    "pyright>=1.1.402",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.2",
]
doc = [
    "nbconvert",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "zensical",
]

[project.urls]
Homepage = "https://github.com/GW-JAX-Team/flowMC"
Documentation = "https://gw-jax-team.github.io/flowMC/"
Repository = "https://github.com/GW-JAX-Team/flowMC"
"Bug Tracker" = "https://github.com/GW-JAX-Team/flowMC/issues"
Changelog = "https://github.com/GW-JAX-Team/flowMC/releases"

[tool.uv.sources]
flowMC = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { local_scheme = "no-local-version", version_scheme = "semver-pep440-release-branch" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    "F722",
    # Preserve the project's preferred spelling for optional and multi-member unions.
    "UP007",
    "UP045",
    "N999",
]

[tool.pyright]
include = ["src"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ty.src]
# Match the existing static-analysis scope; tests are linted separately.
include = ["src"]

[tool.ty.analysis]
# jaxtyping's dtype/shape markers (Float, Bool, Int, Key, PyTree, Shaped, ...) are
# generated via __class_getitem__ into Annotated[...] forms that ty cannot yet
# resolve (each usage raises invalid-type-form). That covers effectively every
# public symbol we import from the package -- only jaxtyping.Array (a re-export of
# jax.Array) is unaffected, and it's never used outside those markers here.
# replace-imports-with-any matches import paths, not individual symbols, so there
# is no way to opt out of just the problematic aliases; verified narrowing this to
# e.g. ["jaxtyping.Key"] does not work and reintroduces the same errors for the
# other markers. Revisit once ty supports Annotated-based generics.
replace-imports-with-any = ["jaxtyping.**"]

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\. )?abstractmethod",
]
